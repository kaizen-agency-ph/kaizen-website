.wp { --ink:#3A2E3F; --ink-soft:#7A6B79; --paper:#FBF5F4; --card:#FFFFFF;
  --line:#EBDDD8; --rose:#A8657C; --rose-deep:#8C4F66; --rose-soft:#F5E7EC;
  --sage:#6F8676; --sage-soft:#E6EDE7; --gold:#B8902F;
  background:var(--paper); color:var(--ink); font-family:'Outfit',system-ui,sans-serif;
  min-height:100vh; -webkit-font-smoothing:antialiased; line-height:1.45; }
.wp *{ box-sizing:border-box; }
.wp-wrap{ max-width:1040px; margin:0 auto; padding:28px 20px 64px; }

.wp .eyebrow{ font-size:11px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--rose); font-weight:600; }
.wp .serif{ font-family:'Fraunces',Georgia,serif; }

/* Header — doubles as the hero: photo backdrop + countdown, so there's no empty card below */
.wp-head{ position:relative; padding:22px 24px; border:1px solid var(--line);
  border-radius:20px; background:linear-gradient(180deg,#fff, #FCF7F5);
  box-shadow:0 1px 0 rgba(58,46,63,.02); overflow:hidden;
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap; }
.wp-head.has-bg{ min-height:240px; border-color:transparent; }
.wp-headmain{ position:relative; z-index:2; min-width:0; }
.wp-head h1{ font-family:'Fraunces',Georgia,serif; font-weight:400; margin:5px 0 3px;
  font-size:clamp(30px,5.4vw,48px); line-height:1.03; letter-spacing:-.015em; }
.wp-head .amp{ color:var(--rose); font-style:italic; padding:0 .1em; }
.wp-head .sub{ color:var(--ink-soft); font-size:13.5px; }
.wp-headbg{ position:absolute; inset:0; z-index:0; overflow:hidden; }
.wp-headbg img{ width:100%; height:100%; object-fit:cover; display:block; transform-origin:center; }
/* scrim rises from the bottom so the photo stays visible up top and text stays readable */
.wp-headveil{ position:absolute; inset:0; z-index:1; pointer-events:none;
  background:linear-gradient(to top, rgba(251,245,244,.97) 0%, rgba(251,245,244,.9) 30%, rgba(251,245,244,.5) 62%, rgba(251,245,244,.12) 100%); }
.wp-head .eyebrow{ position:relative; z-index:2; }

/* countdown, docked in the header */
.wp-hcount{ position:relative; z-index:2; text-align:right; flex:none; line-height:1; }
.wp-hcount .n{ font-family:'Fraunces',Georgia,serif; color:var(--gold); font-weight:300;
  font-size:clamp(46px,9vw,76px); line-height:.9; letter-spacing:-.02em; display:block; }
.wp-hcount .lbl{ font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--ink-soft); margin-top:8px; display:block; }
.wp-hcount .date{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; display:block; }
.wp-hcta{ position:relative; z-index:2; font-size:13px; color:var(--ink-soft); max-width:210px; text-align:right; }
@media (max-width:600px){
  .wp-head{ align-items:flex-start; flex-direction:column; gap:14px; }
  .wp-head.has-bg{ min-height:210px; }
  .wp-hcount, .wp-hcta{ text-align:left; }
  .wp-hcount .n{ font-size:54px; }
}
.wp-bgprev{ width:132px; height:60px; border-radius:10px; overflow:hidden; border:1px solid var(--line); flex:none; }
.wp-bgprev img{ width:100%; height:100%; object-fit:cover; display:block; }
.wp-slider{ display:flex; align-items:center; gap:12px; margin-top:10px; }
.wp-slider > span{ font-size:12px; color:var(--ink-soft); width:130px; flex:none; }
.wp-range{ -webkit-appearance:none; appearance:none; flex:1; height:5px; border-radius:999px;
  background:var(--rose-soft); outline:none; padding:0; }
.wp-range::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:18px; height:18px;
  border-radius:50%; background:var(--rose-deep); cursor:pointer; border:2px solid #fff; box-shadow:0 1px 3px rgba(58,46,63,.3); }
.wp-range::-moz-range-thumb{ width:18px; height:18px; border-radius:50%; background:var(--rose-deep);
  cursor:pointer; border:2px solid #fff; }

/* Nav */

/* View animation */

/* Cards & grid */

.wp input:focus, .wp textarea:focus, .wp select:focus{ outline:none;

/* Buttons */

/* Budget table */

/* Kanban */

<div id="app" class="wp"></div>
<script>
(function(){
  "use strict";

  /* ---------- constants & helpers ---------- */
  var KEY = "wedding-plan-v1";
  var STAGES = ["todo", "doing", "done"];
  var STAGE_LABEL = { todo: "To do", doing: "In progress", done: "Done" };
  function uid(){ return Math.random().toString(36).slice(2, 9); }

  function seed(){
    return {
      details: { partner1:"", partner2:"", date:"", venue:"", guests:"", theme:"", currency:detectCurrencySymbol(), notes:"", bg:"", bgPosX:50, bgPosY:50, bgZoom:100, themePrimary:"#A8657C", themeSecondary:"#6F8676", themeAccent:"#B8902F" },
      budget: { total:"", items:[
        {id:uid(),label:"Venue",est:"",act:""},
        {id:uid(),label:"Catering",est:"",act:""},
        {id:uid(),label:"Photography & video",est:"",act:""},
        {id:uid(),label:"Attire",est:"",act:""},
        {id:uid(),label:"Flowers & decor",est:"",act:""},
        {id:uid(),label:"Music & entertainment",est:"",act:""},
        {id:uid(),label:"Invitations",est:"",act:""},
        {id:uid(),label:"Cake & desserts",est:"",act:""}
      ]},
      tasks: [
        {id:uid(),title:"Got engaged",cat:"",due:"",status:"done",notes:"",images:[]}
      ],
      vendors: { categories:[
        {id:uid(),label:"Venue",chosenId:null,options:[]},
        {id:uid(),label:"Catering",chosenId:null,options:[]},
        {id:uid(),label:"Photography & video",chosenId:null,options:[]},
        {id:uid(),label:"Florist",chosenId:null,options:[]},
        {id:uid(),label:"Music / DJ",chosenId:null,options:[]},
        {id:uid(),label:"Cake",chosenId:null,options:[]},
        {id:uid(),label:"Hair & makeup",chosenId:null,options:[]}
      ]},
      seating: { guests: [], tables: [], props: [] }
    };
  }

  function normalize(o){
    var s = seed();
    if(!o) return s;
    return {
      details: Object.assign({}, s.details, o.details || {}),
      budget: {
        total: (o.budget && o.budget.total != null) ? o.budget.total : "",
        items: (o.budget && Array.isArray(o.budget.items)) ? o.budget.items : s.budget.items
      },
      tasks: Array.isArray(o.tasks) ? o.tasks.map(function(t){
        return Object.assign({ notes:"", images:[], vendorImages:[] }, t);
      }) : s.tasks,
      vendors: (o.vendors && Array.isArray(o.vendors.categories))
        ? { categories: o.vendors.categories.map(function(c){
            return { id:c.id||uid(), label:c.label||"", chosenId:c.chosenId||null,
              options:(c.options||[]).map(function(op){ return Object.assign({images:[],rating:0}, op); }) };
          }) }
        : s.vendors,
      seating: (o.seating && Array.isArray(o.seating.guests) && Array.isArray(o.seating.tables))
        ? { guests: o.seating.guests, tables: o.seating.tables.map(function(t){
            return { id:t.id||uid(), name:t.name||"", shape:t.shape||"round", rot: t.rot||0,
              x: t.x||20, y: t.y||20, seats:(t.seats||[]).map(function(se){ return { id:se.id||uid(), label:se.label||"", guestId:se.guestId||null }; }) };
          }), props: Array.isArray(o.seating.props) ? o.seating.props.map(function(pr){
            return { id:pr.id||uid(), type:pr.type||"furniture", label:pr.label||"", x:pr.x||20, y:pr.y||20, w:pr.w||120, h:pr.h||70, rot: pr.rot||0 };
          }) : [] }
        : s.seating
    };
  }

  var saveError = false;
  /* EDITION SWITCH: true = coordinator (multi-wedding dashboard), false = couples (single wedding). */
  var COORD = false;
  /* ONBOARDING: first-run setup wizard + guided tour (enabled only in the offline couples build). */
  var ONBOARD = true;
  /* true in the signed-in builds: first-run onboarding is triggered by the
     account's cloud flag instead of this device's localStorage. */
  var AUTH_MODE = false;
  /* Downloadable offline build served alongside this page (set per edition at build time). */
  var OFFLINE_FILE = "offline/wedding-planner-offline.html";
  /* Storage is per-device and never synced. If the sign-in page exposes an account
     id (window.WP_USER), each account gets its own separate planner on this device. */
  function accountTag(){
    try {
      var u = window.WP_USER || (window.localStorage && localStorage.getItem("wp_account")) || "";
      u = String(u).trim().toLowerCase();
      if(!u) return "";
      var h = 5381, i = u.length;
      while(i) h = (h * 33) ^ u.charCodeAt(--i);
      return "__" + (h >>> 0).toString(36);
    } catch(e){ return ""; }
  }
  var BIZ_KEY = (COORD ? "wedding-biz-v1" : "wedding-couple-v1") + accountTag();
  var STATUSES = ["Lead", "Booked", "Planning", "Completed", "Cancelled"];

  var CURRENCIES = [
    { code:"USD", sym:"$",   name:"US Dollar" },
    { code:"EUR", sym:"\u20ac", name:"Euro" },
    { code:"GBP", sym:"\u00a3", name:"British Pound" },
    { code:"CAD", sym:"C$",  name:"Canadian Dollar" },
    { code:"AUD", sym:"A$",  name:"Australian Dollar" },
    { code:"NZD", sym:"NZ$", name:"New Zealand Dollar" },
    { code:"PHP", sym:"\u20b1", name:"Philippine Peso" },
    { code:"JPY", sym:"\u00a5", name:"Japanese Yen" },
    { code:"CNY", sym:"CN\u00a5", name:"Chinese Yuan" },
    { code:"INR", sym:"\u20b9", name:"Indian Rupee" },
    { code:"SGD", sym:"S$",  name:"Singapore Dollar" },
    { code:"HKD", sym:"HK$", name:"Hong Kong Dollar" },
    { code:"MXN", sym:"MX$", name:"Mexican Peso" },
    { code:"BRL", sym:"R$",  name:"Brazilian Real" },
    { code:"ZAR", sym:"R",   name:"South African Rand" },
    { code:"AED", sym:"AED", name:"UAE Dirham" },
    { code:"CHF", sym:"CHF", name:"Swiss Franc" },
    { code:"SEK", sym:"kr",  name:"Swedish Krona" },
    { code:"KRW", sym:"\u20a9", name:"Korean Won" },
    { code:"THB", sym:"\u0e3f", name:"Thai Baht" },
    { code:"IDR", sym:"Rp",  name:"Indonesian Rupiah" },
    { code:"MYR", sym:"RM",  name:"Malaysian Ringgit" }
  ];
  var REGION_CCY = { US:"USD", PH:"PHP", GB:"GBP", IE:"EUR", DE:"EUR", FR:"EUR", ES:"EUR", IT:"EUR",
    NL:"EUR", PT:"EUR", AT:"EUR", BE:"EUR", GR:"EUR", FI:"EUR", CA:"CAD", AU:"AUD", NZ:"NZD",
    JP:"JPY", CN:"CNY", IN:"INR", SG:"SGD", HK:"HKD", MX:"MXN", BR:"BRL", ZA:"ZAR", AE:"AED",
    CH:"CHF", SE:"SEK", KR:"KRW", TH:"THB", ID:"IDR", MY:"MYR" };
  function symForCode(code){ var c = CURRENCIES.filter(function(x){ return x.code === code; })[0]; return c ? c.sym : null; }
  // Guess the currency symbol from the machine's locale; falls back to USD.
  function detectCurrencySymbol(){
    try {
      var loc = (navigator.languages && navigator.languages[0]) || navigator.language || "en-US";
      var region;
      try { region = new Intl.Locale(loc).maximize().region; } catch(e){ region = (loc.split("-")[1] || "").toUpperCase(); }
      var sym = symForCode(REGION_CCY[region]);
      if(sym) return sym;
    } catch(e){}
    return "$";
  }

  function defaultMeta(){ return { clientName:"", email:"", phone:"", pkg:"", fee:"", paid:"", status:"Lead", notes:"", payments:[] }; }
  function wrapWedding(plan){ return { id: uid(), meta: defaultMeta(), plan: plan }; }
  function normalizeBiz(o){
    var b = { name: (o && o.name) || "My Coordination Co.", currency: (o && o.currency) || detectCurrencySymbol(), activeId: (o && o.activeId) || null, weddings: [] };
    if(o && Array.isArray(o.weddings)) b.weddings = o.weddings.map(function(w){
      return { id: w.id || uid(), meta: Object.assign(defaultMeta(), w.meta || {}), plan: normalize(w.plan || {}) };
    });
    return b;
  }
  function loadBiz(){
    try { var v = localStorage.getItem(BIZ_KEY); if(v) return normalizeBiz(JSON.parse(v)); } catch(e){}
    try { var old = localStorage.getItem(KEY); if(old) return normalizeBiz({ weddings:[ { plan: JSON.parse(old) } ] }); } catch(e){}
    return normalizeBiz({});
  }
  // Some browsers (notably Safari opening a file directly from disk) block
  // storage entirely. Detect it so we can warn instead of silently losing work.
  var storageOK = (function(){
    try { var k = "__wp_t"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  })();

  function save(){
    try { localStorage.setItem(BIZ_KEY, JSON.stringify(biz)); saveError = false; }
    catch(e){ saveError = true; updateFoot(); }
    // mirror to the account's cloud copy when signed in (debounced in auth.js)
    if(window.__wdCloudSave){ try { window.__wdCloudSave(JSON.stringify(biz)); } catch(e){} }
  }

  var biz = loadBiz();
  var appMode = "home";
  function active(){ return biz.weddings.filter(function(w){ return w.id === biz.activeId; })[0] || null; }
  var state = active() ? active().plan : (biz.weddings[0] ? biz.weddings[0].plan : seed());
  if(!COORD){
    if(!biz.weddings.length){ biz.weddings.push(wrapWedding(seed())); }
    biz.activeId = biz.weddings[0].id;
    state = biz.weddings[0].plan;
    appMode = "wedding";
  }
  syncBudget();
  save();

  /* ---- hooks used by the signed-in wrapper (js/auth.js) ---- */
  window.__wdGetData = function(){ try { return JSON.stringify(biz); } catch(e){ return null; } };
  window.__wdApplyCloud = function(jsonStr){
    var obj; try { obj = JSON.parse(jsonStr); } catch(e){ return; }
    biz = normalizeBiz(obj);
    if(!COORD){
      if(!biz.weddings.length){ biz.weddings.push(wrapWedding(seed())); }
      biz.activeId = biz.weddings[0].id;
      state = biz.weddings[0].plan;
      appMode = "wedding";
    } else {
      appMode = "home"; biz.activeId = null;
      state = biz.weddings[0] ? biz.weddings[0].plan : seed();
    }
    try { localStorage.setItem(BIZ_KEY, JSON.stringify(biz)); } catch(e){}
    syncBudget();
    render();
  };

  /* DOM builder */
  function el(tag, attrs, children){
    var n = document.createElement(tag);
    if(attrs) for(var k in attrs){
      var v = attrs[k];
      if(v == null || v === false) continue;
      if(k === "class") n.className = v;
      else if(k === "style" && typeof v === "object") Object.assign(n.style, v);
      else if(k === "html") n.innerHTML = v;
      else if(k.slice(0,2) === "on" && typeof v === "function") n.addEventListener(k.slice(2).toLowerCase(), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    if(children != null){
      if(!Array.isArray(children)) children = [children];
      children.forEach(function(c){
        if(c == null || c === false) return;
        n.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
      });
    }
    return n;
  }

  /* image compression -> jpeg data url */
  function compressImage(file, maxDim, quality){
    maxDim = maxDim || 900; quality = quality || 0.72;
    return new Promise(function(resolve, reject){
      if(!file || !file.type || file.type.indexOf("image/") !== 0){ reject(new Error("not-image")); return; }
      var reader = new FileReader();
      reader.onload = function(){
        var img = new Image();
        img.onload = function(){
          var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          var w = Math.max(1, Math.round(img.width * scale));
          var h = Math.max(1, Math.round(img.height * scale));
          var cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          var ctx = cv.getContext("2d");
          ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          try { resolve(cv.toDataURL("image/jpeg", quality)); } catch(e){ reject(e); }
        };
        img.onerror = function(){ reject(new Error("decode")); };
        img.src = reader.result;
      };
      reader.onerror = function(){ reject(new Error("read")); };
      reader.readAsDataURL(file);
    });

  /* formatting */
  /* theme colors */
  function hexToRgb(h){ h = (h||"").replace("#",""); if(h.length===3) h = h.split("").map(function(c){ return c+c; }).join(""); var n = parseInt(h,16); return [ (n>>16)&255, (n>>8)&255, n&255 ]; }
  function toHex2(v){ v = Math.max(0, Math.min(255, Math.round(v))); return ("0"+v.toString(16)).slice(-2); }
  function mix(a,b,t){ var A=hexToRgb(a),B=hexToRgb(b); return "#"+toHex2(A[0]+(B[0]-A[0])*t)+toHex2(A[1]+(B[1]-A[1])*t)+toHex2(A[2]+(B[2]-A[2])*t); }
  function lum(hex){ var c = hexToRgb(hex).map(function(v){ v/=255; return v<=0.03928 ? v/12.92 : Math.pow((v+0.055)/1.055, 2.4); }); return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2]; }
  function adjustReadable(hex, maxLum){ var c = hex, g = 0; while(lum(c) > maxLum && g < 16){ c = mix(c, "#000000", 0.1); g++; } return c; }
  function normalizeHex(s){ s = (s||"").trim().replace(/^#/,""); if(/^[0-9a-fA-F]{3}$/.test(s)) s = s.split("").map(function(c){return c+c;}).join(""); if(/^[0-9a-fA-F]{6}$/.test(s)) return "#" + s.toLowerCase(); return null; }
  function applyThemeTo(node){

    var s = state.details.themeSecondary || "#6F8676";
    var a = state.details.themeAccent || "#B8902F";
    node.style.setProperty("--rose", adjustReadable(p, 0.5));
    node.style.setProperty("--rose-deep", adjustReadable(p, 0.3));
    node.style.setProperty("--rose-soft", mix(p, "#ffffff", 0.86));
    node.style.setProperty("--sage", adjustReadable(s, 0.5));
    node.style.setProperty("--sage-soft", mix(s, "#ffffff", 0.85));
    node.style.setProperty("--gold", adjustReadable(a, 0.55));
  }

  /* ---- file handle store (write back to the same export file) ---- */
  var fileHandle = null, fhChecked = false;
  function fhDB(){
    return new Promise(function(res, rej){
      if(!window.indexedDB){ rej(0); return; }
      var r = indexedDB.open(BIZ_KEY + "__fh", 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore("h"); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(0); };
    });
  }
  function fhSave(h){
    return fhDB().then(function(db){
      return new Promise(function(res){
        var tx = db.transaction("h", "readwrite");
        tx.objectStore("h").put(h, "export");
        tx.oncomplete = function(){ res(); }; tx.onerror = function(){ res(); };
      });
    }).catch(function(){});
  }
  function fhLoad(){
    return fhDB().then(function(db){
      return new Promise(function(res){
        var tx = db.transaction("h", "readonly");
        var q = tx.objectStore("h").get("export");
        q.onsuccess = function(){ res(q.result || null); }; q.onerror = function(){ res(null); };
      });
    }).catch(function(){ return null; });
  }
  function fhClear(){ fhDB().then(function(db){ var tx = db.transaction("h","readwrite"); tx.objectStore("h").delete("export"); }).catch(function(){}); }

  function exportFileName(){
    var names = [state.details.partner1, state.details.partner2].filter(Boolean);
    var tag = names.length ? names.join("-and-").replace(/\s+/g, "") : "plan";
    return (COORD ? "wedding-book" : "wedding-" + tag.toLowerCase()) + ".json";
  }
  function exportPayload(){ return JSON.stringify(COORD ? biz : state, null, 2); }
  function downloadFallback(data, name){
    var blob = new Blob([data], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function fsaSupported(){
    try { return ("showSaveFilePicker" in window) && window.self === window.top; } catch(e){ return false; }
  }

  // Writes to the file chosen the first time; only prompts again if that file is gone.
  function exportPlan(){
    var data = exportPayload(), name = exportFileName();
    var doneMsg = COORD ? "Book exported." : "Plan exported. Keep the file safe \u2014 that's your backup.";
    function finish(text, sameFile){
      ioMsg = { ok:true, text: text };
      markExported();
      render();
    }
    if(!fsaSupported()){
      try { downloadFallback(data, name); finish(doneMsg); }
      catch(e){ ioMsg = { ok:false, text:"Couldn't create the export file. Try again." }; render(); }
      return;
    }
    (function(){
      var start = fileHandle ? Promise.resolve(fileHandle) : (fhChecked ? Promise.resolve(null) : fhLoad().then(function(h){ fhChecked = true; fileHandle = h; return h; }));
      start.then(function(h){
        if(!h) return pickAndWrite(data, name, doneMsg);
        return h.queryPermission({ mode:"readwrite" }).then(function(p){
          if(p === "granted") return null;
          return h.requestPermission({ mode:"readwrite" });
        }).then(function(p){
          if(p && p !== "granted"){ return pickAndWrite(data, name, doneMsg); }
          return writeTo(h, data).then(function(){
            finish("Saved to " + (h.name || name) + " \u2014 your existing backup file was updated.");
          });
        }).catch(function(){ return pickAndWrite(data, name, doneMsg); });
      }).catch(function(){ try { downloadFallback(data, name); finish(doneMsg); } catch(e){} });
    })();
  }
  function writeTo(h, data){
    return h.createWritable().then(function(w){
      return w.write(new Blob([data], { type:"application/json" })).then(function(){ return w.close(); });
    });
  }
  function pickAndWrite(data, name, doneMsg){
    return window.showSaveFilePicker({
      suggestedName: name,
      types: [{ description:"Wedding plan backup", accept: { "application/json": [".json"] } }]
    }).then(function(h){
      return writeTo(h, data).then(function(){
        fileHandle = h; fhChecked = true; fhSave(h);
        ioMsg = { ok:true, text:"Saved to " + (h.name || name) + ". Future exports update this same file automatically." };
        markExported(); render();
      });
    }).catch(function(err){
      if(err && err.name === "AbortError"){ return; }   // user cancelled — say nothing
      try { downloadFallback(data, name); ioMsg = { ok:true, text: doneMsg }; markExported(); render(); }
      catch(e){ ioMsg = { ok:false, text:"Couldn't create the export file. Try again." }; render(); }
    });
  }

  /* ---- backup tracking ---- */
  var EXP_KEY = BIZ_KEY + "__exp";
  var REMIND_MS = 10 * 60 * 1000;
  var sessionStart = Date.now();
  var lastExportSig = null, lastExportAt = null;
  try { var _ex = JSON.parse(localStorage.getItem(EXP_KEY)); if(_ex){ lastExportSig = _ex.sig; lastExportAt = _ex.at; } } catch(_){}
  var reminderSnoozeUntil = (lastExportAt || sessionStart) + REMIND_MS;

  function hashStr(s){ var h = 5381, i = s.length; while(i){ h = (h * 33) ^ s.charCodeAt(--i); } return (h >>> 0).toString(36); }
  function currentSig(){ try { return hashStr(JSON.stringify(COORD ? biz : state)); } catch(_){ return ""; } }
  function hasUnsaved(){ return currentSig() !== lastExportSig; }
  function markExported(){
    lastExportSig = currentSig(); lastExportAt = Date.now();
    try { localStorage.setItem(EXP_KEY, JSON.stringify({ sig:lastExportSig, at:lastExportAt })); } catch(_){}
    reminderSnoozeUntil = Date.now() + REMIND_MS;
    hideReminder();
  }
  function relTime(ts){
    if(!ts) return "never";
    var m = Math.round((Date.now() - ts) / 60000);
    if(m < 1) return "just now";
    if(m < 60) return m + " min ago";
    var h = Math.round(m / 60); if(h < 24) return h + " hour" + (h > 1 ? "s" : "") + " ago";
    var d = Math.round(h / 24); return d + " day" + (d > 1 ? "s" : "") + " ago";
  }
  function planHasContent(){
    if(COORD) return biz.weddings.length > 0;
    var d = state.details;
    return !!(d.partner1 || d.partner2 || d.venue || d.bg || d.notes
      || (state.seating.guests && state.seating.guests.length)
      || (state.seating.tables && state.seating.tables.length)
      || state.budget.items.some(function(i){ return i.act || i.est; })
      || state.vendors.categories.some(function(c){ return c.chosenId; }));

    bar.appendChild(el("span", { class:"wp-remind-txt" }, "\ud83d\udcbe It's been a while since your last backup \u2014 export " + (COORD ? "your book" : "your plan") + " to keep it safe."));

    bar.appendChild(btns);

  }
  function hideReminder(){ var b = document.getElementById("wp-remind"); if(b) b.remove(); }
  function maybeRemind(){

  function importPlan(file){
    if(!file) return;
    var r = new FileReader();

        }

  }

  /* ---------- Vendors ---------- */
  function chooseVendor(catId, optId){
    var cat = find(state.vendors.categories, catId);
    cat.chosenId = cat.chosenId === optId ? null : optId;
    var opt = cat.options.filter(function(o){ return o.id === cat.chosenId; })[0];
    if(opt){
      var title = "Book & confirm " + (opt.name || cat.label);
      var vimgs = (opt.images || []).slice(0, 3);
      var existing = state.tasks.filter(function(t){ return t.vendorKey === catId; })[0];
      if(existing){
        existing.title = title; existing.cat = cat.label;
        syncVendorImages(existing, vimgs);
      } else {
        state.tasks.push({ id:uid(), title:title, cat:cat.label, due:"", status:"todo", notes:"", images:vimgs.slice(), vendorImages:vimgs.slice(), vendorKey:catId });
      }
    } else {
      state.tasks = state.tasks.filter(function(t){ return t.vendorKey !== catId; });
    }
    syncBudget();
    save(); render();
  }

  // Keep a linked task's photos in step with its chosen vendor, without
  // touching any photos the couple added to the card themselves.
  function syncVendorImages(task, vimgs){
    var oldV = task.vendorImages || [];
    var own = (task.images || []).filter(function(src){ return oldV.indexOf(src) === -1; });
    task.images = vimgs.concat(own).slice(0, 8);
    task.vendorImages = vimgs.slice();
  }

  // If this option is the chosen one, push its current photos to the linked task.
  function refreshVendorTaskImages(cat, opt){
    if(!cat || !opt || cat.chosenId !== opt.id) return;
    var task = state.tasks.filter(function(t){ return t.vendorKey === cat.id; })[0];
    if(task) syncVendorImages(task, (opt.images || []).slice(0, 3));
  }

  // Pull a number out of a free-text price like "$12,000", "8k", "1.2m".
  function parsePrice(s){
    if(s == null) return null;
    var str = String(s).toLowerCase().replace(/[,\s$\u20b1\u20ac\u00a3]/g, "");
    var m = str.match(/(\d+(?:\.\d+)?)([km]?)/);
    if(!m) return null;
    var n = Number(m[1]);
    if(m[2] === "k") n *= 1000; else if(m[2] === "m") n *= 1000000;
    return isNaN(n) ? null : n;
  }

  // Keep the Budget in sync with chosen vendors: estimate = quoted price,
  // actual = price once the linked "Book & confirm" task is marked done.
  function syncBudget(){
    var items = state.budget.items;
    var catIds = {};
    // Every vendor category gets a matching budget row (adopting an existing
    // same-named row if there is one). Estimated stays the couple's own number;
    // only Actual is filled from the chosen vendor once its task is done.
    state.vendors.categories.forEach(function(c){
      catIds[c.id] = true;
      var linked = items.filter(function(it){ return it.vendorKey === c.id; })[0];
      if(!linked){
        linked = items.filter(function(it){ return !it.vendorKey && it.label && it.label.toLowerCase() === (c.label || "").toLowerCase(); })[0];
        if(linked){ linked.vendorKey = c.id; }
        else { linked = { id:uid(), label:c.label, est:"", act:"", vendorKey:c.id, auto:true }; items.push(linked); }
      }
      linked.label = c.label;
      var opt = c.options.filter(function(o){ return o.id === c.chosenId; })[0];
      var price = opt ? parsePrice(opt.price) : null;
      if(opt){
        linked.vendorName = opt.name || "";
        var task = state.tasks.filter(function(t){ return t.vendorKey === c.id; })[0];
        var paid = !!(task && task.status === "done");
        linked.act = (paid && price != null) ? String(price) : "";
      } else {
        delete linked.vendorName;
        linked.act = "";
      }
    });
    // rows whose vendor category is gone: drop auto-made ones, unlink the rest
    items = items.filter(function(it){ return !(it.vendorKey && !catIds[it.vendorKey] && it.auto); });
    items.forEach(function(it){ if(it.vendorKey && !catIds[it.vendorKey]){ delete it.vendorKey; delete it.vendorName; } });
    state.budget.items = items;
  }

  // Drag-and-drop: move a task into a column, optionally before a specific card.
  var dragTaskId = null;
  function moveTaskBefore(dragId, targetId, stage){
    if(dragId === targetId) return;
    var tasks = state.tasks;
    var di = -1; for(var k = 0; k < tasks.length; k++){ if(tasks[k].id === dragId){ di = k; break; } }
    if(di < 0) return;
    var dragged = tasks.splice(di, 1)[0];
    dragged.status = stage;
    if(targetId){
      var ti = -1; for(var m = 0; m < tasks.length; m++){ if(tasks[m].id === targetId){ ti = m; break; } }
      if(ti < 0) tasks.push(dragged); else tasks.splice(ti, 0, dragged);
    } else { tasks.push(dragged); }
    if(dragged.vendorKey) syncBudget();
    save(); render();
  }

      th.appendChild(el("img", { src:src, alt:"", onClick:function(){ openLightbox(src); } }));
      th.appendChild(el("button", { class:"wp-thumb-x", "aria-label":"Remove image", onClick:function(){ arr.splice(ix, 1); save(); render(); } }, "×"));
      g.appendChild(th);
    });
    if(arr.length < cap){
      var lab = el("label", { class:"wp-addimg", title:"Add inspiration" }, el("span", {}, "+"));
      var inp = el("input", { type:"file", accept:"image/*", multiple:true, style:{ display:"none" } });
      inp.addEventListener("change", function(e){
        var files = Array.prototype.slice.call(e.target.files || []).filter(function(file){ return file.type.indexOf("image/") === 0; });
        files = files.slice(0, Math.max(0, cap - arr.length));
        e.target.value = "";
        if(!files.length) return;
        lab.classList.add("busy"); lab.firstChild.textContent = "…";
        var urls = [], chain = Promise.resolve();
        files.forEach(function(file){ chain = chain.then(function(){ return compressImage(file).then(function(u){ urls.push(u); }, function(){}); }); });
        chain.then(function(){ if(urls.length){ state.seating.inspo = arr.concat(urls); save(); render(); } });
      });
      lab.appendChild(inp);
      g.appendChild(lab);
    }
    box.appendChild(g);
    return box;
  }

  function sBuildCanvas(opts){
    opts = opts || {};
    function bw(){ return Math.max(600, Math.min(6000, state.seating.boardW || 1000)); }
    function bh(){ return Math.max(400, Math.min(4000, state.seating.boardH || 640)); }
    var wrapEl = el("div", { class:"wp-boardwrap" + (opts.fill ? " wp-boardwrap-fs" : "") });
    var sizer = el("div", { class:"wp-boardsizer" });
    var boardEl = el("div", { class:"wp-seatboard" });
    boardEl.style.width = bw() + "px"; boardEl.style.height = bh() + "px";
    state.seating.props.forEach(function(pr){ boardEl.appendChild(renderProp(pr, boardEl)); });
    state.seating.tables.forEach(function(t){ boardEl.appendChild(renderTable(t, boardEl)); });
    if(state.seating.tables.length === 0 && state.seating.props.length === 0){
      boardEl.appendChild(el("div", { class:"wp-boardhint" }, "Your seating canvas — add a table or decor to begin."));
    }
    sizer.appendChild(boardEl);
    wrapEl.appendChild(sizer);

    var zlabel;
    function applyZoom(){
      boardEl.style.width = bw() + "px"; boardEl.style.height = bh() + "px";
      boardEl.style.transform = "scale(" + seatZoom + ")";
      sizer.style.width = (bw() * seatZoom) + "px";
      sizer.style.height = (bh() * seatZoom) + "px";
      if(zlabel) zlabel.textContent = Math.round(seatZoom * 100) + "%";
    }
    function grow(dw, dh){
      state.seating.boardW = Math.max(600, Math.min(6000, bw() + dw));
      state.seating.boardH = Math.max(400, Math.min(4000, bh() + dh));
      save(); applyZoom();
    }
    // Auto-expand the board so it at least fills the visible area (never shrinks below content).
    function fit(){
      var availW = Math.floor((wrapEl.clientWidth - 6) / seatZoom);
      var availH = Math.floor((wrapEl.clientHeight - 6) / seatZoom);
      var nw = Math.min(6000, Math.max(bw(), availW));
      var nh = Math.min(4000, Math.max(bh(), availH));
      if(nw > bw() || nh > bh()){ state.seating.boardW = nw; state.seating.boardH = nh; save(); applyZoom(); }
    }
    var zoomBar = el("div", { class:"wp-zoombar" });
    zoomBar.appendChild(el("span", { class:"wp-zttl" }, "Zoom"));
    zoomBar.appendChild(el("button", { class:"wp-zbtn", "aria-label":"Zoom out", onClick:function(){ seatZoom = Math.max(0.4, Math.round((seatZoom - 0.1) * 20) / 20); applyZoom(); } }, "−"));
    zlabel = el("span", { class:"wp-zval" }, Math.round(seatZoom * 100) + "%");
    zoomBar.appendChild(zlabel);
    zoomBar.appendChild(el("button", { class:"wp-zbtn", "aria-label":"Zoom in", onClick:function(){ seatZoom = Math.min(2, Math.round((seatZoom + 0.1) * 20) / 20); applyZoom(); } }, "+"));
    zoomBar.appendChild(el("span", { class:"wp-zttl", style:{ marginLeft:"12px" } }, "Canvas"));
    zoomBar.appendChild(el("button", { class:"wp-zbtn", "aria-label":"Wider canvas", title:"Wider", onClick:function(){ grow(400, 0); } }, "↔"));
    zoomBar.appendChild(el("button", { class:"wp-zbtn", "aria-label":"Taller canvas", title:"Taller", onClick:function(){ grow(0, 300); } }, "↕"));
    zoomBar.appendChild(el("button", { class:"wp-btn ghost wp-zreset", onClick:function(){ seatZoom = 1; state.seating.boardW = 1000; state.seating.boardH = 640; save(); applyZoom(); } }, "Reset"));
    return { zoomBar:zoomBar, wrapEl:wrapEl, applyZoom:applyZoom, boardEl:boardEl, fit:fit };
  }

  function addTable(shape, seatCount){
    var seats = []; for(var i=0;i<seatCount;i++) seats.push({ id:uid(), label:"", guestId:null });
    var n = state.seating.tables.length;
    var col = n % 3, row = Math.floor(n / 3);
    state.seating.tables.push({ id:uid(), name:"Table " + (n+1), shape:shape, rot:0, x: 24 + col*300, y: 20 + row*272, seats:seats });

  function renderTable(t, boardEl){
    var n = t.seats.length;
    var wrap = el("div", { class:"wp-table " + (t.shape === "rect" ? "rect" : "round") });
    wrap.style.left = (t.x||0) + "px"; wrap.style.top = (t.y||0) + "px";

    var head = el("div", { class:"wp-thead" });
    var grip = el("div", { class:"wp-grip", "aria-label":"Drag table" }, "\u2b0e");
    head.appendChild(grip);
    var nameIn = el("input", { class:"wp-tname", placeholder:"Table" }); nameIn.value = t.name;
    nameIn.addEventListener("input", function(){ t.name = nameIn.value; save(); });
    head.appendChild(nameIn);
    head.appendChild(el("button", { class:"wp-gx", "aria-label":"Delete table", onClick:function(){
      state.seating.tables = state.seating.tables.filter(function(x){ return x.id !== t.id; }); save(); render();
    } }, "\u00d7"));
    wrap.appendChild(head);

    var area = el("div", { class:"wp-tarea" });
    var seatSize = 44;
    if(t.shape === "round"){
      var D = Math.max(170, 120 + n*10);
      area.style.width = D + "px"; area.style.height = D + "px";
      var center = el("div", { class:"wp-tcenter" });
      center.style.width = (D*0.42) + "px"; center.style.height = (D*0.42) + "px";
      center.style.left = (D*0.29) + "px"; center.style.top = (D*0.29) + "px";
      area.appendChild(center);
      var R = D/2 - seatSize/2 - 4;
      for(var i=0;i<n;i++){
        var ang = -Math.PI/2 + i*(2*Math.PI/n);
        var sx = D/2 + R*Math.cos(ang) - seatSize/2;
        var sy = D/2 + R*Math.sin(ang) - seatSize/2;
        area.appendChild(seatChip(t, t.seats[i], i, sx, sy, seatSize));
      }
    } else {
      var per = Math.ceil(n/2);
      var W = per*(seatSize+8) + 12;
      var H = 150;
      area.style.width = W + "px"; area.style.height = H + "px";
      var rectC = el("div", { class:"wp-tcenter rect" });
      rectC.style.left = "6px"; rectC.style.width = "calc(100% - 12px)";
      rectC.style.top = (seatSize+8) + "px"; rectC.style.height = (H - 2*(seatSize+8)) + "px";
      area.appendChild(rectC);
      for(var j=0;j<n;j++){
        var top = j < per;
        var idx = top ? j : (j - per);
        var sx2 = 6 + idx*(seatSize+8);
        var sy2 = top ? 2 : (H - seatSize - 2);
        area.appendChild(seatChip(t, t.seats[j], j, sx2, sy2, seatSize));
      }
    }
    wrap.appendChild(area);
    if(t.rot){ wrap.style.transform = "rotate(" + t.rot + "deg)"; }
    var rot = el("div", { class:"wp-rotate", "aria-label":"Rotate table", title:"Drag to rotate" }, "\u21bb");
    wrap.appendChild(rot);
    enableDrag(grip, wrap, t, boardEl);
    enableRotate(rot, wrap, t);
    return wrap;
  }

  function seatChip(t, seat, index, x, y, size){
    var filled = !!(seat.guestId || seat.label);
    var label = seat.guestId ? guestName(seat.guestId) : (seat.label || String(index+1));
    var chip = el("button", { class:"wp-seat" + (filled ? " filled" : ""), title:label, onClick:function(e){ e.stopPropagation(); openSeatPicker(t.id, seat.id); } });
    chip.style.left = x + "px"; chip.style.top = y + "px"; chip.style.width = size + "px"; chip.style.height = size + "px";
    chip.appendChild(el("span", {}, filled ? initials(label) : String(index+1)));
    return chip;
  }

  function enableDrag(handle, target, t, boardEl){
    handle.style.touchAction = "none";
    handle.addEventListener("pointerdown", function(e){
      e.preventDefault();
      try { handle.setPointerCapture(e.pointerId); } catch(_){}
      var sx = e.clientX, sy = e.clientY, ox = t.x||0, oy = t.y||0;
      function mv(ev){
        var nx = ox + (ev.clientX - sx) / seatZoom;
        var ny = oy + (ev.clientY - sy) / seatZoom;
        nx = Math.max(0, Math.min(boardEl.scrollWidth - target.offsetWidth, nx));
        ny = Math.max(0, Math.min(boardEl.scrollHeight - target.offsetHeight, ny));
        target.style.left = nx + "px"; target.style.top = ny + "px";
        t.x = nx; t.y = ny;
      }
      function up(){ document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); save(); }
      document.addEventListener("pointermove", mv);
      document.addEventListener("pointerup", up);
    });
  }

  // Drag a rotate handle around the element's center to spin it.
  function enableRotate(handle, target, item){
    handle.style.touchAction = "none";
    handle.addEventListener("pointerdown", function(e){
      e.preventDefault(); e.stopPropagation();
      try { handle.setPointerCapture(e.pointerId); } catch(_){}
      var rect = target.getBoundingClientRect();
      var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
      function mv(ev){
        var ang = Math.round(Math.atan2(ev.clientY - cy, ev.clientX - cx) * 180 / Math.PI + 90);
        [0,45,90,135,180,225,270,315,360].forEach(function(s){ if(Math.abs(ang - s) <= 4) ang = s; });
        item.rot = ((ang % 360) + 360) % 360;
        target.style.transform = "rotate(" + item.rot + "deg)";
      }
      function up(){ document.removeEventListener("pointermove", mv); document.removeEventListener("pointerup", up); save(); }
      document.addEventListener("pointermove", mv);
      document.addEventListener("pointerup", up);
    });
  }

  function wDays(w){ var d = w.plan.details.date; if(!d) return null; var dt = new Date(d + "T00:00:00"); if(isNaN(dt)) return null; var t = new Date(); t.setHours(0,0,0,0); return Math.round((dt - t) / 86400000); }

      var v = Number(amt.value); if(!v || v <= 0) return;

  function payFmt(v){ return biz.currency + Number(v || 0).toLocaleString(undefined, { maximumFractionDigits:2 }); }

  // Fee, paid, live balance, batch payments and a paid-in-full switch.
  function paymentBlock(m){
    var wrap = el("div", { class:"wp-paybox" });
    wrap.appendChild(el("div", { class:"eyebrow" }, "Payments"));

    var feeIn = el("input", { type:"number", min:"0", inputMode:"decimal", placeholder:"0" });
    feeIn.value = m.fee || "";
    var paidIn = el("input", { type:"number", min:"0", inputMode:"decimal", placeholder:"0" });
    paidIn.value = m.paid || "";

    var balNum = el("div", { class:"wp-balnum" });
    var balNote = el("div", { class:"wp-balnote" });
    var pbar = el("div", { class:"wp-bar sage", style:{ marginTop:"10px" } });
    var pbarI = el("i", {}); pbar.appendChild(pbarI);
    var fullBtn = el("button", { class:"wp-btn" });

    function refresh(){
      var fee = Number(m.fee || 0), paid = Number(m.paid || 0), bal = fee - paid;
      var pct = fee > 0 ? Math.min(100, (paid / fee) * 100) : 0;
      balNum.textContent = payFmt(Math.abs(bal));
      balNum.style.color = bal > 0 ? "var(--rose-deep)" : "var(--sage)";
      if(fee <= 0) balNote.textContent = "Set a contract fee to track payments.";
      else if(bal > 0) balNote.textContent = payFmt(paid) + " of " + payFmt(fee) + " received \u00b7 " + Math.round(pct) + "%";
      else if(bal === 0) balNote.textContent = "Paid in full \u2713";
      else balNote.textContent = "Overpaid by " + payFmt(-bal);
      pbarI.style.width = pct + "%";
      var isFull = fee > 0 && paid >= fee;
      fullBtn.textContent = isFull ? "\u2713 Paid in full" : "Mark paid in full";
      fullBtn.className = "wp-btn" + (isFull ? " wp-btn-paid" : "");
      fullBtn.disabled = fee <= 0;
      wrap.classList.toggle("paid", isFull);
      if(feeIn.value !== (m.fee || "")) feeIn.value = m.fee || "";
      paidIn.value = m.paid || "";
    }

    feeIn.addEventListener("input", function(){ m.fee = feeIn.value; save(); refresh(); });
    paidIn.addEventListener("input", function(){ m.paid = paidIn.value; save(); refresh(); });

    var g = el("div", { class:"wp-grid cols-2", style:{ marginTop:"14px" } });
    g.appendChild(el("label", { class:"wp-field" }, [ el("span", {}, "Contract fee (" + biz.currency + ")"), feeIn ]));
    g.appendChild(el("label", { class:"wp-field" }, [ el("span", {}, "Total paid so far (" + biz.currency + ")"), paidIn ]));
    wrap.appendChild(g);

    var balBox = el("div", { class:"wp-balbox" });
    var bl = el("div", {});
    bl.appendChild(el("div", { class:"wp-ballbl" }, "Balance due"));
    bl.appendChild(balNum);
    bl.appendChild(balNote);
    balBox.appendChild(bl);
    balBox.appendChild(fullBtn);
    wrap.appendChild(balBox);
    wrap.appendChild(pbar);

    // add a payment (for clients paying in batches)
    var addWrap = el("div", { class:"wp-addpay" });
    addWrap.appendChild(el("span", { class:"wp-addpaylbl" }, "Add a payment"));
    var amt = el("input", { type:"number", min:"0", inputMode:"decimal", placeholder:biz.currency + " amount received" });
    function addPayment(){
      var v = Number(amt.value);
      if(!v || v <= 0) return;
      m.paid = String(Number(m.paid || 0) + v);
      m.payments = (m.payments || []).concat([{ amt:v, on:new Date().toISOString().slice(0,10) }]);
      amt.value = "";
      save(); refresh(); renderPayLog();
    }
    amt.addEventListener("keydown", function(e){ if(e.key === "Enter") addPayment(); });
    var addBtn = el("button", { class:"wp-btn", onClick:addPayment }, "+ Add");
    var row = el("div", { class:"wp-addpayrow" });
    row.appendChild(amt); row.appendChild(addBtn);
    addWrap.appendChild(row);
    wrap.appendChild(addWrap);

    var log = el("div", { class:"wp-paylog" });
    function renderPayLog(){
      log.innerHTML = "";
      var ps = m.payments || [];
      if(!ps.length) return;
      log.appendChild(el("div", { class:"wp-ballbl", style:{ marginBottom:"6px" } }, "Payment history"));
      ps.slice().reverse().forEach(function(pmt, ri){
        var idx = ps.length - 1 - ri;
        var r = el("div", { class:"wp-payrow" });
        r.appendChild(el("span", {}, payFmt(pmt.amt)));
        r.appendChild(el("span", { class:"wp-paydate" }, pmt.on));
        r.appendChild(el("button", { class:"wp-gx", "aria-label":"Remove payment", onClick:function(){
          m.paid = String(Math.max(0, Number(m.paid || 0) - Number(pmt.amt || 0)));
          m.payments.splice(idx, 1);
          save(); refresh(); renderPayLog();
        } }, "\u00d7"));
        log.appendChild(r);
      });
    }
    renderPayLog();
    wrap.appendChild(log);

    fullBtn.addEventListener("click", function(){
      var fee = Number(m.fee || 0); if(fee <= 0) return;
      if(Number(m.paid || 0) >= fee){
        m.paid = ""; m.payments = [];
      } else {
        var owed = fee - Number(m.paid || 0);
        if(owed > 0) m.payments = (m.payments || []).concat([{ amt:owed, on:new Date().toISOString().slice(0,10) }]);
        m.paid = String(fee);
        if(m.status !== "Completed" && m.status !== "Cancelled") m.status = "Booked";
      }
      save(); refresh(); renderPayLog(); render();
    });

    refresh();
    return wrap;
  }

  function exportPortfolio(){

      var url = URL.createObjectURL(blob); var a = document.createElement("a");
      a.href = url; a.download = (biz.name || "coordination").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-portfolio.json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
      ioMsg = { ok:true, text:"Whole portfolio exported \u2014 that's your business backup." };

    render();
  }
  function importPortfolio(file){
    if(!file) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var obj = JSON.parse(r.result);
        if(!obj || !Array.isArray(obj.weddings)) throw new Error("shape");
        if(!window.confirm("Import this portfolio? It replaces ALL weddings currently in this app.")) return;
        biz = normalizeBiz(obj); appMode = "home"; biz.activeId = null; save(); markExported();
        ioMsg = { ok:true, text:"Portfolio imported." };
      } catch(e){ ioMsg = { ok:false, text:"That file isn't a portfolio export. Pick the ...-portfolio.json file." }; }
      render();
    };
    r.onerror = function(){ ioMsg = { ok:false, text:"Couldn't read that file." }; render(); };
    r.readAsText(file);
  }

  function showWizard(){

       ["\u2705","Tasks","A \u201cBook & confirm\u201d card appears \u2014 drag it to Done when it's booked."],

  var COORD_TOUR = [

    { view:"home", sel:"button", selText:"+ Add wedding", title:"Add a new client", text:"Booking a new couple? Add them here and their planner is created instantly." },
    { view:"home", sel:"button", selText:"Export all", title:"Back up your whole book", text:"Exports every wedding into one file. The first time you'll choose where to save it; after that it updates that same file, so your backup stays current." },
    { view:"wedding", tab:"Client", title:"The Client tab \u2014 just for you", text:"Contact details, package, contract fee, amount paid, status and private notes. The balance due is worked out for you and rolls up to your dashboard." },

    { view:"wedding", tab:"Tasks", title:"Run the to-do board", text:"Drag cards between To do, In progress and Done. When a vendor's \u201cBook & confirm\u201d card reaches Done, its cost is recorded as actually spent in the couple's budget." },

    { view:"home", sel:".wp-fbbtn", title:"Help is a tap away", text:"Questions or feedback? Tap Feedback any time \u2014 you can also replay this tour from there. Happy coordinating!", place:"above" }
  ];
  var COUPLE_TOUR = [
    { view:"wedding", tab:"Overview", title:"Your home screen", text:"The Overview shows a countdown to the big day, your budget at a glance, task progress, and what's up next. It updates as you fill in the other tabs." },
    { view:"wedding", tab:"Details", title:"The essentials & backups", text:"Names, date, venue, your theme colors, and a header photo live here. This is also where you Export a backup file \u2014 your plan is saved on this device, so export to keep a copy or move to another device." },

    { view:"wedding", tab:"Vendors", title:"Compare, then choose", text:"Add the venues, caterers and others you're considering, with photos, prices and notes. Tap Choose on your pick \u2014 it creates a \u201cBook & confirm\u201d task and its budget row." },
    { view:"wedding", tab:"Tasks", title:"Your to-do board", text:"Drag cards between To do, In progress and Done (or use \u2039 \u203a). Tap a card to add dates, notes and photos." },

  ];
  var tourIdx = 0, tourActive = false;
  function tourSteps(){ return COORD ? COORD_TOUR : COUPLE_TOUR; }
  function navBtn(label){ var bs = document.querySelectorAll(".wp-nav button"); for(var i = 0; i < bs.length; i++){ if(bs[i].textContent.trim() === label) return bs[i]; } return null; }
  function startTour(){ tourIdx = 0; tourActive = true; showTourStep(); }
  function endTour(){
    tourActive = false;
    var o = document.getElementById("wp-tour"); if(o) o.remove();
    markOnboarded();
    if(COORD){ appMode = "home"; biz.activeId = null; } else { tab = "overview"; }
    render();
  }
  function showTourStep(){
    var steps = tourSteps(), s = steps[tourIdx];
    // put the app in the right place for this step
    if(COORD){
      if(s.view === "home"){ appMode = "home"; biz.activeId = null; }
      else { if(!biz.weddings.length) biz.weddings.push(wrapWedding(seed()));
             biz.activeId = biz.weddings[0].id; var w = active(); if(w) state = w.plan; appMode = "wedding"; }
    }
    if(s.tab) tab = s.tab.toLowerCase();
    render(); window.scrollTo(0, 0);

    var old = document.getElementById("wp-tour"); if(old) old.remove();
    var target = null;
    if(s.tab) target = navBtn(s.tab);
    else if(s.selText){ var bs = document.querySelectorAll(s.sel);
      for(var i = 0; i < bs.length; i++){ if(bs[i].textContent.trim().indexOf(s.selText) > -1){ target = bs[i]; break; } } }
    else if(s.sel) target = document.querySelector(s.sel);
    var rect = target ? target.getBoundingClientRect() : null;
    if(rect && (rect.width === 0 || rect.height === 0)) rect = null;

    var ov = el("div", { id:"wp-tour", class:"wp-tour" + (rect ? "" : " nodim") });
    if(rect){
      var spot = el("div", { class:"wp-tourspot" });
      spot.style.left = (rect.left - 6) + "px"; spot.style.top = (rect.top - 6) + "px";
      spot.style.width = (rect.width + 12) + "px"; spot.style.height = (rect.height + 12) + "px";
      ov.appendChild(spot);
    }
    var tip = el("div", { class:"wp-tourtip" });
    tip.appendChild(el("div", { class:"eyebrow" }, "Step " + (tourIdx + 1) + " of " + steps.length));
    tip.appendChild(el("div", { class:"wp-tourttl" }, s.title));
    tip.appendChild(el("p", { class:"wp-tourtxt" }, s.text));
    var foot = el("div", { class:"wp-tourfoot" });
    foot.appendChild(el("button", { class:"wp-btn ghost", onClick:endTour }, "Skip tour"));
    var right = el("div", { style:{ display:"flex", gap:"8px" } });
    if(tourIdx > 0) right.appendChild(el("button", { class:"wp-btn ghost", onClick:function(){ tourIdx--; showTourStep(); } }, "Back"));
    right.appendChild(el("button", { class:"wp-btn", onClick:function(){ if(tourIdx < steps.length - 1){ tourIdx++; showTourStep(); } else endTour(); } }, tourIdx < steps.length - 1 ? "Next" : "Finish"));
    foot.appendChild(right);
    tip.appendChild(foot);
    var tipW = 330, tipH = 210;
    if(rect && s.place === "above"){ tip.style.left = Math.max(12, rect.left) + "px"; tip.style.bottom = (window.innerHeight - rect.top + 12) + "px"; }
    else if(rect){
      tip.style.left = Math.min(Math.max(12, rect.left), Math.max(12, window.innerWidth - tipW - 12)) + "px";
      if(rect.bottom + tipH + 20 > window.innerHeight) tip.style.bottom = (window.innerHeight - rect.top + 12) + "px";
      else tip.style.top = (rect.bottom + 14) + "px";
    }
    else { tip.style.left = "50%"; tip.style.top = "28%"; tip.style.transform = "translateX(-50%)"; }
    ov.appendChild(tip);
    app.appendChild(ov);
  }
  window.addEventListener("resize", function(){ if(tourActive) showTourStep(); });

    fb.innerHTML = '<span class="wp-fbic">\ud83d\udc4d</span><span><b>Facebook</b><br>Message Kaizen Agency</span>';
